<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=">
<title>Grok 注册机控制面板</title>
<link rel="stylesheet" href="/static/style.css?v=20260809-grok-standalone">
</head>
<body>
<header class="topbar">
  <div class="brand-row">
    <button id="btn-nav" class="menu-toggle" type="button" aria-label="打开任务菜单" aria-expanded="false">☰</button>
    <div class="brand">🤖 Grok 注册机 <span class="sub">独立版</span></div>
  </div>
  <div class="top-actions">
    <div class="status" id="status">
      <span class="status-item"><span class="dot" id="dot-proxy"></span>代理池</span>
      <span class="version" id="version" title="WebUI 版本">v1.0</span>
      <span class="running" id="running"></span>
    </div>
  </div>
</header>

<div class="layout">
  <button id="nav-backdrop" class="nav-backdrop" type="button" aria-label="关闭任务菜单"></button>
  <nav class="sidebar">
    <div class="nav-section">
      <button class="navbtn active" data-view="run">▶ 运行任务</button>
      <button class="navbtn" data-view="env">⚙️ 配置 (.env)</button>
    </div>
    <div id="script-nav"></div>
  </nav>

  <main class="content">
    <!-- 运行视图 -->
    <section id="view-run">
      <div id="form-panel" class="panel">
        <p class="hint">← 左侧选择「Grok 注册」任务</p>
      </div>
      <div class="panel log-panel">
        <div class="log-head">
          <div class="log-heading">
            <span id="log-title">运行日志</span>
            <span id="run-state" class="run-state idle" role="status" aria-live="polite">待运行</span>
          </div>
          <button id="btn-stop" class="btn-stop" disabled>停止</button>
        </div>
        <pre id="log" class="log"></pre>
      </div>
    </section>

    <!-- 配置视图 -->
    <section id="view-env" style="display:none">
      <div class="panel">
        <div class="env-head">
          <h2>环境配置 (.env)</h2>
          <button id="btn-save-env" class="btn-run">保存配置</button>
          <span id="env-msg" class="env-msg"></span>
        </div>
        <p class="hint">密钥只保存在本机 .env，不上传。保存后新任务立即使用，无需重启服务。必填项标 <span class="req">*</span>。</p>
        <div id="env-groups"></div>
      </div>
    </section>
  </main>
</div>

<script src="/static/app.js?v=20260809-grok-standalone"></script>
</body>
</html>
